[mypy]
# 新版 mypy 不再支持 3.9 目标；3.8/3.9 的运行时兼容由 CI 测试矩阵（3.8–3.12）保证
python_version = 3.10
warn_unused_ignores = True
warn_redundant_casts = True
show_error_codes = True
check_untyped_defs = True
disallow_untyped_defs = True

[mypy-markdown_it.*]
ignore_missing_imports = True

[mypy-mdit_py_plugins.*]
ignore_missing_imports = True

[mypy-docx.*]
ignore_missing_imports = True

[mypy-html4docx.*]
ignore_missing_imports = True

[mypy-bs4.*]
ignore_missing_imports = True

[mypy-bleach.*]
ignore_missing_imports = True

[mypy-flask.*]
ignore_missing_imports = True

[mypy-flask_wtf.*]
ignore_missing_imports = True

[mypy-werkzeug.*]
ignore_missing_imports = True

[mypy-requests.*]
ignore_missing_imports = True

# tomllib 仅存在于 Python ≥3.11；mypy 固定按 3.9 检查，这里放行 import
[mypy-tomllib]
ignore_missing_imports = True

# tomli 仅在 Python <3.11 安装（条件依赖），≥3.11 环境下放行其缺失
[mypy-tomli]
ignore_missing_imports = True

# mcp 是可选 extra（[mcp]，需 Python ≥3.10）；未安装时不应阻断 mypy 门禁
[mypy-mcp.*]
ignore_missing_imports = True
