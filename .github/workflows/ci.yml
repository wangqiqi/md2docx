name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, dev ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.cursor/**'
  pull_request:
    branches: [ main, master, dev ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.cursor/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-${{ matrix.python-version }}-
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]

    - name: Run tests with coverage
      run: |
        python -m pytest tests/ src/mddocx/webui/tests/ --cov=src --cov-report=xml --cov-report=term-missing

    - name: Upload coverage to Codecov
      if: matrix.python-version == '3.11' && github.event_name == 'pull_request'
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  quality:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install quality tools
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]

    - name: Run flake8
      run: flake8 src tests

    - name: Run black check
      run: black --check --diff src tests

    - name: Run mypy (converter package)
      run: mypy src/mddocx/converter --config-file mypy.ini

    - name: Run mypy (standalone modules)
      run: |
        mypy --follow-imports=skip src/mddocx/errors.py src/mddocx/webui/rate_limit.py --config-file mypy.ini

    - name: Run isort check
      run: isort --check-only --diff src tests

    - name: ConvertMetrics baseline gate
      env:
        # 结构字段硬失败；耗时默认 soft，避免 runner 抖动假红
        METRICS_SOFT: "1"
      run: bash scripts/check_convert_metrics.sh

    - name: Release alignment gate
      run: bash scripts/verify_release_alignment.sh

  build:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build

    - name: Build package
      run: python -m build

    - name: Check package
      run: |
        pip install twine
        twine check dist/*

  # 注意：发布功能已移至 publish.yml，只在 tag 推送时触发
  # 如需手动发布，请使用: ./scripts/publish_to_pypi.sh
