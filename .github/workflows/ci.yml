name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, dev ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.cursor/**'
  pull_request:
    branches: [ main, master, dev ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.cursor/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # GitHub ubuntu-latest（26.04+）不再提供 3.8/3.9；矩阵与 MCP extra（≥3.10）对齐
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-${{ matrix.python-version }}-
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]
        # mcp extra 依赖 Python ≥3.10：低版本只验证核心与 WebUI
        if python -c "import sys; sys.exit(0 if sys.version_info >= (3, 10) else 1)"; then
          pip install -e .[mcp]
        fi

    - name: Run tests with coverage
      run: |
        python -m pytest tests/ src/mddocx/webui/tests/ --cov=src --cov-report=xml --cov-report=term-missing

    - name: Upload coverage to Codecov
      if: matrix.python-version == '3.11' && github.event_name == 'pull_request'
      uses: codecov/codecov-action@v7
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  quality:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'

    - name: Install quality tools
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install -e .[dev,mcp]

    - name: pip-audit (dependency security)
      run: |
        pip install pip-audit
        pip-audit

    - name: Run flake8
      run: flake8 src tests

    - name: Run black check
      run: black --check --diff src tests

    - name: Run mypy (converter package)
      run: mypy src/mddocx/converter --config-file mypy.ini

    - name: Run mypy (standalone modules)
      run: |
        mypy --follow-imports=skip \
          src/mddocx/__init__.py \
          src/mddocx/cli.py \
          src/mddocx/errors.py \
          src/mddocx/mcp/convert.py \
          src/mddocx/mcp/server.py \
          src/mddocx/webui/app.py \
          src/mddocx/webui/batch.py \
          src/mddocx/webui/config.py \
          src/mddocx/webui/converter_pool.py \
          src/mddocx/webui/rate_limit.py \
          src/mddocx/webui/start_webui.py \
          --config-file mypy.ini

    - name: Run isort check
      run: isort --check-only --diff src tests

    - name: ConvertMetrics baseline gate
      env:
        # 结构字段硬失败；耗时默认 soft，避免 runner 抖动假红
        METRICS_SOFT: "0"
      run: bash scripts/check_convert_metrics.sh

    - name: Release alignment gate
      run: bash scripts/verify_release_alignment.sh

  docs-security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '20'
        cache: npm

    - name: npm audit (VitePress docs)
      run: bash scripts/check_npm_audit.sh

  build:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build

    - name: Build package
      run: python -m build

    - name: Check package
      run: |
        pip install twine
        twine check dist/*

  # 注意：发布功能已移至 publish.yml，只在 tag 推送时触发
  # 如需手动发布，请使用: ./scripts/publish_to_pypi.sh
