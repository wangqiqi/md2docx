name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'  # 推送版本标签时触发，如 v1.0.0, v2.1.3
  workflow_dispatch:  # 允许手动触发

permissions:
  contents: read
  id-token: write  # 这是OIDC的关键权限，用于Trusted Publisher

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Release alignment gate (tag must match pyproject)
      run: |
        python -m pip install --upgrade pip
        pip install 'tomli>=2.0.0'
        EXPECT_TAG=${{ github.ref_name }} bash scripts/verify_release_alignment.sh

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Build package
      run: python -m build

    - name: Check package
      run: twine check dist/*

    - name: Publish to PyPI (Trusted Publisher)
      id: trusted-publish
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        print-hash: true
      continue-on-error: true

    - name: Check Trusted Publisher result
      if: steps.trusted-publish.outcome == 'failure'
      run: |
        echo "⚠️  Trusted Publisher 发布失败"
        echo "📋 解决方法："
        echo "   1. 访问: https://pypi.org/manage/project/mddocx/settings/publishing/"
        echo "   2. 添加 Trusted Publisher:"
        echo "      - Publisher: GitHub"
        echo "      - Repository: wangqiqi/md2docx"
        echo "      - Workflow: publish.yml"
        echo "      - Environment: (留空)"
        echo "   3. 或使用手动发布: ./scripts/publish_to_pypi.sh"
        echo ""
        echo "🔍 当前 claims 信息:"
        echo "   sub: repo:wangqiqi/md2docx:ref:refs/tags/${GITHUB_REF#refs/tags/}"
        echo "   repository: wangqiqi/md2docx"
        echo "   repository_owner: wangqiqi"
        echo "   workflow_ref: wangqiqi/md2docx/.github/workflows/publish.yml@refs/tags/${GITHUB_REF#refs/tags/}"
        echo ""
        echo "📝 注意：测试应在 ci.yml 工作流中完成"
        exit 1

    - name: Verify package on PyPI
      if: steps.trusted-publish.outcome == 'success'
      env:
        PYPI_RETRIES: "3"
        PYPI_RETRY_SLEEP: "8"
      run: |
        VERSION="${GITHUB_REF_NAME#v}"
        echo "📦 核对 PyPI 版本: mddocx==${VERSION}"
        bash scripts/verify_pypi_version.sh "${VERSION}"
